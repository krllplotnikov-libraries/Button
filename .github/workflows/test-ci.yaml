name: Build and Test

on:
  push:
    branches: [master, tests]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and run tests
        run: ./tests/run_test
