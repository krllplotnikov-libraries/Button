name: Build and Test

on:
  push:
    branches: [master, tests]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MicroTest
        run: |
          git clone --depth 1 https://github.com/krllplotnikov-libraries/MicroTest.git "$RUNNER_TEMP/MicroTest"
          cd "$RUNNER_TEMP/MicroTest" && sudo ./install.sh

      - name: Build and run tests
        run: ./tests/run_test
